# Release: push a vX.Y.Z tag made after `scripts/bump-version.py X.Y.Z` (see CONTRIBUTING.md).
# verify -> images (each smoke-tested, then pushed multi-arch to ghcr.io under X.Y.Z tags only)
# -> floating-tags (latest, humble, jazzy move only once every image is up, and only for the
# newest release) -> GitHub Release.
# Only plain vMAJOR.MINOR.PATCH tags release: the per-phase tags (v0.7.0-phase7, ...) do not.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: sudo apt-get update && sudo apt-get install -y rtklib
      - run: uv sync --frozen
      - name: tag matches the package version
        run: |
          v=$(uv run python -c 'import mtrtk; print(mtrtk.__version__)')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != v$v (run scripts/bump-version.py)"; exit 1; }
      # The section bump-version.py cut, without its heading (the release title is the tag); the
      # script fails if the section is missing or has no entries (tests/unit/test_bump_version.py).
      - name: changelog section
        run: |
          uv run python scripts/bump-version.py --notes "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with: { name: release-notes, path: notes.md, if-no-files-found: error }
      # Every version source agrees (test_version_sync.py) along with the rest of the unit suite.
      - run: uv run pytest -q tests/unit
        env:
          MTRTK_REQUIRE_CONVBIN: "1"

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: mtrtk
            file: docker/Dockerfile
            build-args: ""
            suffix: ""
            cache: buildkit  # the scope ci.yml's image job writes
          - name: mtrtk-ros2
            file: ros2/Dockerfile
            build-args: ROS_DISTRO=humble
            suffix: -humble
            cache: ros2-humble
          - name: mtrtk-ros2
            file: ros2/Dockerfile
            build-args: ROS_DISTRO=jazzy
            suffix: -jazzy
            cache: ros2-jazzy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the immutable tags here: ghcr.io/<owner>/mtrtk:X.Y.Z and
      # ghcr.io/<owner>/mtrtk-ros2:X.Y.Z-<distro>. A leg that fails after another leg pushed leaves
      # an unreferenced X.Y.Z tag, never a moved latest/humble/jazzy (the floating-tags job).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}${{ matrix.suffix }}
      # The amd64 image is loaded and smoke-tested before anything is pushed (the same scripts
      # as ci.yml); the mtrtk image's arm64 build is smoke-tested too, under qemu.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          load: true
          tags: smoke:amd64
          cache-from: type=gha,scope=${{ matrix.cache }}
      - if: matrix.name == 'mtrtk'
        run: >-
          docker run --rm --entrypoint sh -v "$PWD/tests/fixtures:/fx:ro" -v "$PWD/docker:/smoke:ro"
          smoke:amd64 /smoke/smoke.sh
      - if: matrix.name == 'mtrtk-ros2'
        run: >-
          docker run --rm -e ROS_DOMAIN_ID=42 -v "$PWD/ros2:/smoke:ro" --entrypoint bash
          smoke:amd64 /smoke/smoke.sh
      - if: matrix.name == 'mtrtk'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: smoke:arm64
          cache-from: type=gha,scope=${{ matrix.cache }}
      - if: matrix.name == 'mtrtk'
        run: >-
          docker run --rm --platform linux/arm64 --entrypoint sh
          -v "$PWD/tests/fixtures:/fx:ro" -v "$PWD/docker:/smoke:ro" smoke:arm64 /smoke/smoke.sh
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  # Runs once every image leg has pushed. latest/humble/jazzy point at the newest plain vX.Y.Z
  # tag only: a patch release on an older line (v0.1.1 after v0.2.0) leaves them where they are.
  floating-tags:
    needs: images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
      - id: newest
        name: is this the newest release?
        run: |
          newest=$(git ls-remote --tags --refs origin | sed 's,.*refs/tags/,,' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is older than $newest: latest, humble and jazzy stay put"
          fi
      - if: steps.newest.outputs.newest == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.newest.outputs.newest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-points the floating tags at the pushed multi-arch manifests; nothing is rebuilt.
      - if: steps.newest.outputs.newest == 'true'
        run: |
          r="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$r/mtrtk:latest" "$r/mtrtk:$v"
          docker buildx imagetools create -t "$r/mtrtk-ros2:humble" "$r/mtrtk-ros2:$v-humble"
          docker buildx imagetools create -t "$r/mtrtk-ros2:jazzy" "$r/mtrtk-ros2:$v-jazzy"

  github-release:
    needs: floating-tags
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-notes }
      - name: docs archive
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar czf "mtrtk-$v-docs.tar.gz" --transform "s,^,mtrtk-$v/," docs README.md CHANGELOG.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          name: mtrtk ${{ github.ref_name }}
          body_path: notes.md
          files: mtrtk-*-docs.tar.gz
          fail_on_unmatched_files: true
          # An older line's patch release is not marked the repository's latest release either.
          make_latest: ${{ needs.floating-tags.outputs.newest }}
