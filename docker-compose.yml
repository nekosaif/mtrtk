services:
  mtrtk:
    image: ghcr.io/nekosaif/mtrtk:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mtrtk
    network_mode: host          # binds directly to the Tailscale IP, sees tailscale0
    restart: unless-stopped
    stop_grace_period: 30s      # 15s consumer grace + up to 12s for the caster, with slack
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - /dev:/dev               # hot-plug safe: nodes appear inside the container on replug
    device_cgroup_rules:
      - "c 166:* rmw"           # ttyACM* (USB CDC, ZED-F9P over USB-C)
      - "c 188:* rmw"           # ttyUSB* (USB-serial adapters)
    healthcheck:
      # TODO(Phase 3): use /healthz once the web API exists - `--version` only proves that the
      # image can run the CLI, not that the daemon inside is still serving corrections.
      test: ["CMD", "mtrtk", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
