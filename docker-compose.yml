services:
  mtrtk:
    image: ghcr.io/nekosaif/mtrtk:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mtrtk
    network_mode: host          # binds directly to the Tailscale IP, sees tailscale0
    restart: unless-stopped
    # 15s consumer grace (CONSUMER_SHUTDOWN_GRACE_S) + 5s for a cancelled job to record why it
    # stopped (jobs.SHUTDOWN_GRACE_S), and slack for the database close behind both.
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - /dev:/dev               # hot-plug safe: nodes appear inside the container on replug
    device_cgroup_rules:
      - "c 166:* rmw"           # ttyACM* (USB CDC, ZED-F9P over USB-C)
      - "c 188:* rmw"           # ttyUSB* (USB-serial adapters)
    healthcheck:
      # GET /healthz on whatever WEB_BIND resolved to, so this fails when the daemon is up but
      # its API has stopped answering - not merely when the container has died.
      test: ["CMD", "mtrtk", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s         # survey-in and the first receiver probe happen before this
    # Hardening (docker/entrypoint.sh): the daemon runs as uid 1000, not root. Root keeps only what
    # the entrypoint needs before it drops for good - CHOWN to take ownership of ./data,
    # SETUID/SETGID for the drop itself (and for `docker compose exec mtrtk mtrtk ...`, which the
    # image's mtrtk wrapper runs as uid 1000 too) - and the daemon is left with no capabilities.
    # DAC_OVERRIDE lets root walk directories it does not own and keeps MTRTK_RUN_AS_ROOT=1 able
    # to write a ./data owned by uid 1000.
    # Host networking and ports above 1024 need none; the serial devices open through the
    # cgroup rules above plus the host's dialout group, added here.
    group_add: ["${DIALOUT_GID:-20}"]   # `getent group dialout | cut -d: -f3` if your host differs
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ROS 2 bridge (docs/ros2.md): docker compose --profile ros2 up -d. It is a WebSocket client
  # of the daemon above; on another machine, run it with --no-deps and MTRTK_WS_URL pointing here.
  mtrtk-ros2:
    profiles: ["ros2"]
    build:
      context: .
      dockerfile: ros2/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: ghcr.io/nekosaif/mtrtk-ros2:${ROS_DISTRO:-humble}
    container_name: mtrtk-ros2
    network_mode: host          # DDS discovery on the host's interfaces, and the daemon's port
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      MTRTK_WS_URL: ${MTRTK_WS_URL:-ws://127.0.0.1:8080/ws}
      # The web token (when WEB_PASSWORD is set): kept out of ROS parameters, which any node on
      # the ROS domain can read, and sent as an Authorization header.
      MTRTK_WS_TOKEN: ${MTRTK_WS_TOKEN:-}
    depends_on: [mtrtk]

  # Public IP (docs/exposure.md): docker compose --profile public up -d. HTTPS for the web UI on
  # PUBLIC_DOMAIN, with a certificate Caddy obtains and renews itself; forward TCP 443 (and 80, for
  # the redirect to HTTPS) to this host. NTRIP is not proxied: forward TCP 2101 to the caster.
  # Needs WEB_BIND=lan or 127.0.0.1 (Caddy dials 127.0.0.1:WEB_PORT) and WEB_PASSWORD.
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    container_name: mtrtk-caddy
    network_mode: host          # binds the host's 80/443 and reaches the daemon on loopback
    restart: unless-stopped
    environment:
      # No `${PUBLIC_DOMAIN:?}`: compose interpolates every service before it applies profiles,
      # so a required variable here would break plain `docker compose up` for everyone else.
      # The entrypoint below refuses to start instead.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      # `email <address>`, or nothing: an empty `email {$ACME_EMAIL}` is a Caddyfile syntax error.
      ACME_EMAIL_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      WEB_PORT: ${WEB_PORT:-8080}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$PUBLIC_DOMAIN" ] || { echo "mtrtk-caddy: set PUBLIC_DOMAIN in .env" >&2; exit 1; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # the ACME account and certificates: keep them across rebuilds
      - caddy_config:/config
    depends_on: [mtrtk]

  # Cloudflare Tunnel (docs/exposure.md): docker compose --profile cloudflare up -d. A remotely
  # managed tunnel: its public hostnames are set in Cloudflare Zero Trust -> Networks -> Tunnels,
  # rtk.<domain> -> http://127.0.0.1:8080 and ntrip.<domain> -> http://127.0.0.1:2101, or your
  # WEB_PORT and NTRIP_PORT if you changed them (NTRIP v2-over-HTTPS rovers only: the tunnel carries
  # HTTP, not raw TCP). Needs WEB_BIND and NTRIP_BIND = lan or 127.0.0.1, and WEB_PASSWORD, or a
  # Cloudflare Access policy plus WEB_BIND=127.0.0.1 and WEB_ALLOW_INSECURE=1 (never with lan).
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: mtrtk-cloudflared
    network_mode: host          # reaches the web UI and the caster on loopback
    restart: unless-stopped
    environment:
      # Read by `tunnel run` itself: as `--token` it would show in `ps` on the host.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # Inside a container cloudflared binds its metrics server to every interface, which on the
      # host network means the host's own; loopback is where the healthcheck asks for /ready.
      # A cloudflared already on the host takes the first free port of 20241-20245: move this one.
      TUNNEL_METRICS: 127.0.0.1:${TUNNEL_METRICS_PORT:-20241}
    command: tunnel --no-autoupdate run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on: [mtrtk]

volumes:
  caddy_data:
  caddy_config:
