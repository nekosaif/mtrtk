[project]
name = "mtrtk"
version = "0.1.0"
description = "Multi-role GNSS RTK/PPK/PPP toolkit for u-blox ZED-F9P base stations and multi-receiver rovers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pyubx2>=1.3.6",
  "pyrtcm>=1.2.0",
  "pynmeagps>=1.1.7",
  "pyserial>=3.5",
  "pyserial-asyncio-fast>=0.16",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "click>=8.1",
  "psutil>=7",
]

[project.scripts]
mtrtk = "mtrtk.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "ruff>=0.11",
  "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtrtk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["hardware: talks to a live receiver on MTRTK_TEST_PORT and reconfigures it"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["mtrtk"]
mypy_path = "src"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyubx2.*", "pyrtcm.*", "pynmeagps.*", "serial.*", "serial_asyncio_fast.*", "psutil.*"]
ignore_missing_imports = true
